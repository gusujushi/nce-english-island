<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新概念英语能力岛</title>
  <link rel="icon" href="icon-192.png">
  <style>
/* 新概念英语能力岛 —— 彩色主题 */
:root {
  --bg: #fff8f0;
  --bg2: #fff1e3;
  --card: #ffffff;
  --ink: #2b2d42;
  --muted: #6b7280;
  --line: #efe6dc;
  --shadow: 0 6px 20px rgba(80, 50, 20, .08);

  --i1: #ff6b6b; /* 珊瑚 */
  --i2: #f9a826; /* 琥珀 */
  --i3: #3dbb6b; /* 青草 */
  --i4: #12a4b6; /* 湖蓝 */
  --i5: #4c6ef5; /* 海军蓝 */
  --i6: #9b5de5; /* 紫罗兰 */

  /* 句子分析配色 */
  --a-conj: #9b5de5;
  --a-verb: #e5484d;
  --a-nonf: #2f9e44;
  --a-prep: #2f7cf6;
  --a-vocab: #ffe066;
  --a-vocab-ink: #5c4400;

  --ok: #2f9e44;
  --bad: #e5484d;
  --accent: #ff6b6b;
  --radius: 16px;
  --font-cn: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-en: Georgia, "Times New Roman", "Noto Serif", serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15151c; --bg2: #1c1c26; --card: #23242f; --ink: #ececf1; --muted: #a1a1b5;
    --line: #34354a; --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    --a-vocab: #6b5a12; --a-vocab-ink: #ffe9a3; --a-prep: #6ea2ff; --a-conj: #c39bff; --a-verb: #ff7b7f; --a-nonf: #5fd07f;
  }
}
:root[data-theme="dark"] {
  --bg: #15151c; --bg2: #1c1c26; --card: #23242f; --ink: #ececf1; --muted: #a1a1b5;
  --line: #34354a; --shadow: 0 6px 20px rgba(0, 0, 0, .35);
  --a-vocab: #6b5a12; --a-vocab-ink: #ffe9a3; --a-prep: #6ea2ff; --a-conj: #c39bff; --a-verb: #ff7b7f; --a-nonf: #5fd07f;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-cn);
  font-size: 15px;
  line-height: 1.65;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--i5); }
.en { font-family: var(--font-en); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden { display: none !important; }

/* ---------- 布局 ---------- */
.app { display: flex; min-height: 100vh; }
.side {
  width: 220px; flex: none; padding: 20px 14px; position: sticky; top: 0; height: 100vh;
  background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.logo-badge {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px;
  background: conic-gradient(var(--i1), var(--i2), var(--i3), var(--i4), var(--i5), var(--i6), var(--i1));
}
.logo b { display: block; font-size: 16px; line-height: 1.2; }
.logo span { font-size: 12px; color: var(--muted); }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; text-decoration: none;
  color: var(--ink); font-weight: 500;
}
.nav a:hover { background: var(--bg2); }
.nav a.on { background: var(--ink); color: var(--card); }
.nav .ico { width: 22px; text-align: center; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px; }

.main { flex: 1; min-width: 0; padding: 26px 32px 80px; max-width: 1180px; }
.topbar { display: none; }

@media (max-width: 860px) {
  .app { flex-direction: column; }
  .side { display: none; }
  .topbar {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: var(--card);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20;
  }
  .topbar a { white-space: nowrap; text-decoration: none; color: var(--ink); padding: 6px 12px; border-radius: 999px; background: var(--bg2); font-size: 14px; }
  .topbar a.on { background: var(--ink); color: var(--card); }
  .main { padding: 18px 16px 80px; }
}

/* ---------- 通用组件 ---------- */
h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 20px; margin: 26px 0 12px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.card {
  background: var(--card); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.btn {
  border: 0; border-radius: 12px; padding: 9px 16px; cursor: pointer; background: var(--bg2); font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; transition: transform .08s ease;
  text-decoration: none; color: inherit;
}
.btn:hover { filter: brightness(.97); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.dark { background: var(--ink); color: var(--card); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px;
  background: var(--bg2); color: var(--muted); font-weight: 600;
}
.chip.done { background: #d3f9d8; color: #2b8a3e; }
:root[data-theme="dark"] .chip.done { background: #1f3b27; color: #8ce99a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.done { background: #1f3b27; color: #8ce99a; } }
.pill-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0; }
.pill-tabs button {
  border: 0; background: var(--card); border: 1.5px solid var(--line); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600;
}
.pill-tabs button.on { background: var(--c, var(--ink)); color: #fff; border-color: transparent; }
.pill-tabs button .ok { color: var(--ok); }
.pill-tabs button.on .ok { color: #fff; }
input[type="text"], input[type="password"], input[type="date"], select, textarea {
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%;
}
textarea { min-height: 140px; resize: vertical; }
.bar { height: 10px; background: var(--bg2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--i1), var(--i2), var(--i3), var(--i4), var(--i5), var(--i6)); border-radius: 999px; }
.note { background: var(--bg2); border-radius: 12px; padding: 12px 14px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--card);
  padding: 10px 18px; border-radius: 12px; z-index: 100; box-shadow: var(--shadow); max-width: 90vw;
}

/* ---------- 首页 ---------- */
.hero {
  border-radius: 22px; padding: 24px 26px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--hc, var(--i1)), color-mix(in srgb, var(--hc, var(--i1)) 55%, #ffb347));
}
.hero h1 { color: #fff; }
.hero .big { font-size: 44px; font-weight: 800; line-height: 1; }
.hero .deco { position: absolute; right: 18px; top: 4px; font-size: 96px; opacity: .25; }
.stat { text-align: center; }
.stat b { font-size: 26px; display: block; }
.task {
  display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: var(--bg);
  border: 1px solid var(--line); text-decoration: none; color: var(--ink);
}
.task:hover { border-color: var(--c, var(--line)); }
.task .num {
  width: 52px; height: 52px; border-radius: 14px; flex: none; display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 18px; background: var(--c);
}

/* ---------- 地图 ---------- */
.island {
  border-radius: 22px; padding: 18px; position: relative;
  background: color-mix(in srgb, var(--c) 12%, var(--card));
  border: 2px solid color-mix(in srgb, var(--c) 35%, transparent);
}
.island-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.island-emoji { font-size: 34px; width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px; background: var(--card); }
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.day {
  border-radius: 14px; padding: 10px 6px; text-align: center; text-decoration: none; color: var(--ink);
  background: var(--card); border: 2px solid transparent; font-size: 12px; line-height: 1.4;
}
.day b { display: block; font-size: 17px; }
.day.today { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
.day.done { background: var(--c); color: #fff; }
.day.review { background-image: repeating-linear-gradient(45deg, transparent 0 6px, color-mix(in srgb, var(--c) 10%, transparent) 6px 12px); }
.day.done.review { background-image: none; }

/* ---------- 课程卡 ---------- */
.lesson-card {
  display: block; text-decoration: none; color: var(--ink); border-radius: 16px; padding: 14px 16px;
  background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--c); box-shadow: var(--shadow);
}
.lesson-card .n { font-weight: 800; color: var(--c); font-size: 13px; }
.lesson-card .t { font-family: var(--font-en); font-size: 17px; font-weight: 700; line-height: 1.3; margin: 2px 0; }
.dots { display: flex; gap: 4px; margin-top: 8px; }
.dots i { width: 100%; height: 6px; border-radius: 4px; background: var(--bg2); }
.dots i.on { background: var(--c); }

/* ---------- 课程页 ---------- */
.lesson-head {
  border-radius: 22px; padding: 22px 24px; color: #fff;
  background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 60%, #222));
}
.lesson-head h1 { color: #fff; font-family: var(--font-en); }
.lesson-head a { color: #fff; }
.steps-guide { counter-reset: s; }
.word-card {
  border-radius: 14px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c);
}
.word-card .w { font-family: var(--font-en); font-size: 20px; font-weight: 700; }
.ipa { font-family: "Lucida Sans Unicode", "Segoe UI", "Arial Unicode MS", sans-serif; color: var(--i5); }
.example { font-family: var(--font-en); font-size: 14px; margin-top: 6px; color: var(--muted); }
.example mark { background: var(--a-vocab); color: var(--a-vocab-ink); border-radius: 4px; padding: 0 2px; }
.star { cursor: pointer; border: 0; background: none; font-size: 20px; line-height: 1; padding: 0 2px; }

/* 精读 */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .reader { grid-template-columns: 1fr; } }
.sent {
  padding: 10px 12px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; display: flex; gap: 10px;
}
.sent:hover { background: var(--bg2); }
.sent.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 8%, var(--card)); }
.sent.playing { background: color-mix(in srgb, var(--i2) 18%, var(--card)); }
.sent .idx { flex: none; width: 26px; color: var(--muted); font-size: 12px; padding-top: 4px; }
.sent .en { font-size: 17px; line-height: 1.6; }
.sent .cn { font-size: 14px; color: var(--muted); margin-top: 2px; }
.sent.meta .en { font-size: 14px; color: var(--muted); font-style: italic; }
.sent .tools { flex: none; display: flex; flex-direction: column; gap: 4px; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--bg2); cursor: pointer; display: grid; place-items: center; font-size: 14px;
}
.icon-btn:hover { background: var(--line); }
.panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
.colored { font-family: var(--font-en); font-size: 19px; line-height: 2; }
.colored .tk { border-radius: 4px; padding: 0 1px; cursor: pointer; }
.colored .tk:hover { outline: 2px solid var(--line); }
.tk.conj { color: var(--a-conj); font-weight: 700; }
.tk.verb { color: var(--a-verb); font-weight: 700; }
.tk.nonf { color: var(--a-nonf); font-weight: 700; text-decoration: underline wavy; text-underline-offset: 4px; }
.tk.prep { color: var(--a-prep); font-weight: 700; }
.tk.vocab { background: var(--a-vocab); color: var(--a-vocab-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; background: var(--k); vertical-align: -1px; }
.chunks { display: flex; flex-wrap: wrap; gap: 6px; }
.chunks span {
  font-family: var(--font-en); padding: 4px 10px; border-radius: 10px; background: var(--bg2); cursor: pointer;
  border-bottom: 3px solid var(--cc);
}
.gtag { border-left: 4px solid var(--k); padding: 6px 10px; border-radius: 0 10px 10px 0; background: var(--bg); margin-top: 8px; }
.gtag b { color: var(--k); }
.ai-box { background: var(--bg); border-radius: 12px; padding: 12px 14px; border: 1px dashed var(--line); }
.ai-box h4 { margin: 10px 0 4px; color: var(--i6); }
.ai-box ul { margin: 4px 0; padding-left: 20px; }

/* 词卡浮层 */
.pop {
  position: fixed; z-index: 90; width: 300px; background: var(--card); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
  border: 1px solid var(--line); padding: 14px;
}
.pop .w { font-family: var(--font-en); font-size: 22px; font-weight: 700; }

/* 测验 */
.q { margin-bottom: 18px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 8px; }
.opt {
  text-align: left; border: 2px solid var(--line); background: var(--card); padding: 10px 12px; border-radius: 12px; cursor: pointer;
}
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--card)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }
.diff .miss { color: var(--bad); text-decoration: line-through; }
.diff .hit { color: var(--ok); }

/* 跟读 */
.shadow-sent { font-family: var(--font-en); font-size: 24px; line-height: 1.6; text-align: center; padding: 20px 10px; }
.big-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.big-btns .btn { padding: 14px 22px; font-size: 16px; border-radius: 16px; }
.rec-on { background: var(--bad) !important; color: #fff !important; animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad) 30%, transparent); } }

/* 闪卡 */
.flash {
  min-height: 220px; display: grid; place-items: center; text-align: center; border-radius: 22px; padding: 26px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--i5) 14%, var(--card)), color-mix(in srgb, var(--i6) 14%, var(--card)));
  border: 1px solid var(--line); cursor: pointer;
}
.flash .w { font-family: var(--font-en); font-size: 38px; font-weight: 800; }

table.map { width: 100%; border-collapse: collapse; font-size: 13px; }
table.map td, table.map th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.drop {
  border: 2.5px dashed var(--line); border-radius: 18px; padding: 26px; text-align: center; background: var(--card);
}
.drop.over { border-color: var(--i4); background: color-mix(in srgb, var(--i4) 10%, var(--card)); }

/* ---------- 手机版：底部导航、分析抽屉、刘海屏安全区 ---------- */
.bottombar, .sheet-close, .sheet-grip { display: none; }
.install-card { border-left: 6px solid var(--i5); }
@media (max-width: 860px) {
  .topbar { display: none; }
  .bottombar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; gap: 2px;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .bottombar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0;
    font-size: 11px; color: var(--muted); text-decoration: none; border-radius: 12px;
  }
  .bottombar a .ico { font-size: 21px; line-height: 1.1; }
  .bottombar a.on { color: var(--ink); background: var(--bg2); font-weight: 700; }
  .main { padding: calc(14px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; }
  h2 { font-size: 18px; margin: 22px 0 10px; }
  .card { padding: 14px 15px; }
  .hero { padding: 20px; }
  .hero .big { font-size: 34px; }
  .hero .deco { font-size: 72px; }
  .lesson-head { padding: 18px; border-radius: 18px; }
  .pill-tabs { flex-wrap: nowrap; overflow-x: auto; margin: 12px -14px; padding: 2px 14px; scrollbar-width: none; }
  .pill-tabs::-webkit-scrollbar { display: none; }
  .pill-tabs button { flex: none; white-space: nowrap; }
  .grid.g2, .grid.g3 { grid-template-columns: 1fr; }
  .grid.g4 { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .days { gap: 5px; }
  .day { padding: 8px 2px; font-size: 11px; }
  .sent { padding: 10px 8px; }
  .sent .en { font-size: 16px; }
  .colored { font-size: 18px; }
  .shadow-sent { font-size: 20px; padding: 14px 4px; }
  .big-btns .btn { padding: 12px 14px; font-size: 15px; }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom)); }
  .pop { width: min(300px, calc(100vw - 16px)); }
  /* 精读页：点句子后从底部弹出分析抽屉 */
  .panel.sheet {
    position: fixed; left: 0; right: 0; top: auto; bottom: 0; z-index: 60; max-height: 80vh; overflow: auto;
    border-radius: 22px 22px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s ease; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25);
  }
  .panel.sheet.open { transform: none; }
  .sheet-grip { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: -4px auto 10px; }
  .sheet-close { display: inline-flex; }
  .backdrop { position: fixed; inset: 0; z-index: 55; background: rgba(0, 0, 0, .35); }
}

/* 返回上一页 */
.backbar { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; min-width: 0; }
.backbar .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-btn { min-height: 40px; padding-left: 12px; padding-right: 14px; font-weight: 700; flex-shrink: 0; }
@media (max-width: 860px) {
  .backbar { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: calc(6px + env(safe-area-inset-top)) 0 8px; margin: calc(-14px - env(safe-area-inset-top)) 0 10px; }
  .back-btn { min-height: 44px; }
}

</style>

  <meta name="theme-color" content="#ff6b6b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
  <div class="app">
    <aside class="side">
      <div class="logo"><div class="logo-badge">🏝️</div><div><b>新概念英语</b><span>能力岛 · 1–4 册英音精读</span></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <nav class="topbar" id="topbar"></nav>
    <main class="main" id="main"></main>
    <nav class="bottombar" id="bottombar"></nav>
  </div>
  <script>
/* 课程资料的公共结构
 * NCE.addRows(册, [[课号, 英文标题, 中文标题, "语法id,…", 中文导读, "单词|英式音标|释义; …", 英音提示?], …])
 * NCE.add(册, {n, t, cn, sum, bg, g:[…], tip, q, w:["单词|音标|释义", …]})
 * 第一册按“单双课”为一个单元：课号写奇数课（1 表示 Lesson 1–2）。
 */
window.NCE = {
  lessons: [],
  add(b, o) { this.lessons.push(Object.assign({ b }, o)); },
  addRows(b, rows) {

  [87, "A perfect alibi", "极好的不在犯罪现场的证据", "noun,modal", "嫌疑人说案发时他在 8 点钟的火车上，探长却指出：那天 8 点那班车根本没开——它出故障停运了。", "alibi|ˈæləbaɪ|n. 不在犯罪现场; commit|kəˈmɪt|v. 犯（罪）; inspector|ɪnˈspektə|n. 探长; employer|ɪmˈplɔɪə|n. 雇主; confirm|kənˈfɜːm|v. 证实; suppose|səˈpəʊz|v. 推测; suggest|səˈdʒest|v. 认为; murder|ˈmɜːdə|n. 谋杀; truth|truːθ|n. 真相; service|ˈsɜːvɪs|n. 运行", ""],

  [90, "What's for supper?", "晚餐吃什么？", "passive,modal", "本课讲海边游泳者与鲨鱼的故事：人们设置防鲨网保护海滩，而一条被捕到的大鲨鱼带来了意想不到的结局。", "shark|ʃɑːk|n. 鲨鱼; net|net|n. 网; giant|ˈdʒaɪənt|adj. 巨大的; swimmer|ˈswɪmə|n. 游泳者; beach|biːtʃ|n. 海滩; attack|əˈtæk|v. 袭击; coast|kəʊst|n. 海岸; stomach|ˈstʌmək|n. 胃; supper|ˈsʌpə|n. 晚餐; deep|diːp|adj. 深的", ""],

  [19, "A very dear cat", "一只贵重的猫", "passive,participle", "富有的拉姆齐太太的猫失踪了，她收到匿名信索要一千英镑赎金；她付了钱，猫准时回了家——这只猫真是“贵”得名副其实。", "kidnapper|ˈkɪdnæpə|n. 绑架者; considerable|kənˈsɪdərəbl|adj. 相当大的; wealthy|ˈwelθi|adj. 富有的; orderly|ˈɔːdəli|adj. 有规律的; disappearance|ˌdɪsəˈpɪərəns|n. 失踪; anonymous|əˈnɒnɪməs|adj. 匿名的; ransom|ˈrænsəm|n. 赎金; cardboard|ˈkɑːdbɔːd|n. 硬纸板; punctually|ˈpʌŋktʃuəli|adv. 准时地; astound|əˈstaʊnd|v. 使震惊; dear|dɪə|adj. 珍爱的；昂贵的", "dear 一语双关：既是“亲爱的”，又是“昂贵的”。"],
  [20, "Pioneer pilots", "飞行员的先驱", "perfect,past", "1909 年，莱瑟姆和布莱里奥争相成为飞越英吉利海峡的第一人；莱瑟姆两次因发动机故障落海，布莱里奥用 37 分钟成功飞到多佛。", "pioneer|ˌpaɪəˈnɪə|n. 先驱; attempt|əˈtempt|n. 尝试; engine|ˈendʒɪn|n. 发动机; float|fləʊt|v. 漂浮; model|ˈmɒdl|n. 型号; overland|ˈəʊvəlænd|adj. 经过陆地的; prize|praɪz|n. 奖金; coast|kəʊst|n. 海岸; force|fɔːs|v. 迫使; greet|ɡriːt|v. 迎接; flight|flaɪt|n. 飞行", ""],
  [21, "Daniel Mendoza", "丹尼尔·门多萨", "passive,past", "18 世纪英国拳击冠军门多萨开创了讲究技巧的“科学拳击”，还开办拳击学校，使拳击成为受人尊重的运动。", "boxing|ˈbɒksɪŋ|n. 拳击; boxer|ˈbɒksə|n. 拳击手; champion|ˈtʃæmpiən|n. 冠军; glove|ɡlʌv|n. 手套; fist|fɪst|n. 拳头; brutal|ˈbruːtl|adj. 残酷的; scientific|ˌsaɪənˈtɪfɪk|adj. 科学的; skill|skɪl|n. 技巧; publicly|ˈpʌblɪkli|adv. 公开地; patron|ˈpeɪtrən|n. 赞助人; contest|ˈkɒntest|n. 比赛", ""],
  [22, "By heart", "熟记台词", "passive,participle", "演狱卒的演员想考考同伴是否背熟了信的内容，递给他一张白纸；“贵族”说光线太暗请狱卒念，狱卒也背不出，只好下台去“拿眼镜”。", "by heart|baɪ ˈhɑːt|熟记; falter|ˈfɔːltə|v. 结巴; cast|kɑːst|v. 选派角色; aristocrat|ˈærɪstəkræt|n. 贵族; imprison|ɪmˈprɪzn|v. 关押; gaoler|ˈdʒeɪlə|n. 监狱看守（英式拼写）; colleague|ˈkɒliːɡ|n. 同事; curtain|ˈkɜːtn|n. 幕; cell|sel|n. 牢房; blank|blæŋk|adj. 空白的; squint|skwɪnt|v. 眯着眼看; dim|dɪm|adj. 暗淡的; proceed|prəˈsiːd|v. 继续", "gaoler 是英式拼写，读音同 jailer /ˈdʒeɪlə/。"],
  [23, "One man's meat is another man's poison", "各有所好", "cond,passive", "人们对食物的好恶毫无逻辑。作者给爱吃蜗牛的朋友送去一袋蜗牛，结果蜗牛爬满了门厅，从此作者再也不敢看蜗牛。", "illogical|ɪˈlɒdʒɪkl|adj. 不合逻辑的; octopus|ˈɒktəpəs|n. 章鱼; delicacy|ˈdelɪkəsi|n. 美味; repulsive|rɪˈpʌlsɪv|adj. 令人厌恶的; snail|sneɪl|n. 蜗牛; praise|preɪz|n. 赞扬; abuse|əˈbjuːs|n. 辱骂; luxury|ˈlʌkʃəri|n. 奢侈品; associate|əˈsəʊsieɪt|v. 联系; despise|dɪˈspaɪz|v. 鄙视; stroll|strəʊl|n. 散步; impulse|ˈɪmpʌls|n. 冲动; dismay|dɪsˈmeɪ|n. 沮丧", ""],
  [24, "A skeleton in the cupboard", "家丑", "passive,perfect", "“家丑”在英语里叫“柜中骷髅”。作者到写侦探小说的朋友家过周末，打开客房衣柜竟真的看到一具骷髅——那是朋友学医时留下的。", "skeleton|ˈskelɪtn|n. 骷髅; cupboard|ˈkʌbəd|n. 柜子; respectable|rɪˈspektəbl|adj. 体面的; conceal|kənˈsiːl|v. 隐藏; vivid|ˈvɪvɪd|adj. 生动的; reputation|ˌrepjuˈteɪʃn|n. 名声; ruin|ˈruːɪn|v. 毁坏; heroine|ˈherəʊɪn|n. 女主人公; fiction|ˈfɪkʃn|n. 小说; petrified|ˈpetrɪfaɪd|adj. 吓呆的; dangle|ˈdæŋɡl|v. 悬荡; sway|sweɪ|v. 摇摆", "cupboard 的 p 不发音 /ˈkʌbəd/。"],
  [25, "The Cutty Sark", "“卡蒂萨克”号帆船", "passive,compare", "19 世纪运茶的快速帆船“卡蒂萨克”号曾与对手“塞莫皮莱”号展开著名的竞赛；汽船出现后帆船时代结束，如今它在格林尼治供人参观。", "clipper|ˈklɪpə|n. 快速帆船; sail|seɪl|n. 帆; rival|ˈraɪvl|n. 对手; rudder|ˈrʌdə|n. 舵; voyage|ˈvɔɪɪdʒ|n. 航行; steamship|ˈstiːmʃɪp|n. 汽船; display|dɪˈspleɪ|n. 展览; wool|wʊl|n. 羊毛; record|ˈrekɔːd|n. 纪录; Greenwich|ˈɡrenɪtʃ|n. 格林尼治", "Greenwich 英音 /ˈɡrenɪtʃ/，w 不发音。"],
  [26, "Wanted: a large biscuit tin", "征求大饼干筒", "passive,inf", "广告商深知人们爱占便宜。一家饼干厂在电台举办“最大饼干”比赛，结果一个大学生烤出一块重 2400 磅的巨型饼干，厂家只好花大价钱买下。", "advertisement|ədˈvɜːtɪsmənt|n. 广告; exert|ɪɡˈzɜːt|v. 施加; subtle|ˈsʌtl|adj. 微妙的; persuade|pəˈsweɪd|v. 说服; classify|ˈklæsɪfaɪ|v. 分类; sample|ˈsɑːmpl|n. 样品; devise|dɪˈvaɪz|v. 想出; capture|ˈkæptʃə|v. 引起（注意）; response|rɪˈspɒns|n. 反应; wheelbarrow|ˈwiːlbærəʊ|n. 独轮车; colossal|kəˈlɒsl|adj. 巨大的; ingredient|ɪnˈɡriːdiənt|n. 配料; anticipate|ænˈtɪsɪpeɪt|v. 预料", "advertisement 英音 /ədˈvɜːtɪsmənt/，重音在第二音节；美音在第三音节。"],
  [27, "Nothing to sell and nothing to buy", "没有什么可卖的，也没有什么可买的", "passive,contrast", "有人说人人都靠出卖某种东西生活，流浪汉却是例外：他们既不出卖什么也不乞求怜悯，选择自由，令人暗暗羡慕。", "philosopher|fəˈlɒsəfə|n. 哲学家; priest|priːst|n. 牧师; spiritual|ˈspɪrɪtʃuəl|adj. 精神的; grudge|ɡrʌdʒ|v. 不情愿; surgeon|ˈsɜːdʒən|n. 外科医生; tramp|træmp|n. 流浪汉; exception|ɪkˈsepʃn|n. 例外; arouse|əˈraʊz|v. 引起; dignity|ˈdɪɡnəti|n. 尊严; deliberately|dɪˈlɪbərətli|adv. 故意地; consequence|ˈkɒnsɪkwəns|n. 后果; afflict|əˈflɪkt|v. 使苦恼; contempt|kənˈtempt|n. 蔑视; envious|ˈenviəs|adj. 羡慕的", ""],
  [28, "Five pounds too dear", "五英镑也太贵", "perfect,participle", "游轮靠港时作者被小贩纠缠，讨价还价后花 5 英镑买了一支“美国制造”的漂亮钢笔，回船后才发现这支笔根本灌不进墨水。", "ware|weə|n. 货物; liner|ˈlaɪnə|n. 班轮; anchor|ˈæŋkə|v. 抛锚; rug|rʌɡ|n. 地毯; tempt|tempt|v. 诱惑; bargain|ˈbɑːɡɪn|v./n. 讨价还价；便宜货; disembark|ˌdɪsɪmˈbɑːk|v. 下船; assail|əˈseɪl|v. 纠缠; marble|ˈmɑːbl|n. 玻璃球; genuine|ˈdʒenjuɪn|adj. 真的; inscribe|ɪnˈskraɪb|v. 刻; gesticulate|dʒeˈstɪkjuleɪt|v. 做手势; outrageous|aʊtˈreɪdʒəs|adj. 不能容忍的; thrust|θrʌst|v. 塞", ""],
  [29, "Funny or not?", "是否可笑？", "noun,passive", "幽默感因民族而异；新近流行的“病态幽默”拿悲剧开玩笑，比如：一个摔断右腿的人好不容易出院参加新年晚会，结果又摔断了左腿。", "humour|ˈhjuːmə|n. 幽默（英式拼写）; mysteriously|mɪˈstɪəriəsli|adv. 神秘地; characteristic|ˌkærəktəˈrɪstɪk|n. 特性; comic|ˈkɒmɪk|adj. 滑稽的; universal|ˌjuːnɪˈvɜːsl|adj. 普遍的; appeal|əˈpiːl|n. 感染力; comedian|kəˈmiːdiən|n. 喜剧演员; distasteful|dɪsˈteɪstfl|adj. 讨厌的; pester|ˈpestə|v. 纠缠; dread|dred|v. 害怕; plaster|ˈplɑːstə|n. 石膏; console|kənˈsəʊl|v. 安慰; hobble|ˈhɒbl|v. 跛行; compensate|ˈkɒmpenseɪt|v. 补偿", ""],
  [30, "The death of a ghost", "幽灵之死", "passive,perfect", "村民们一直以为农场闹鬼：夜里总有活被干完。原来“幽灵”是农场主的大哥埃里克，他二战时开小差，一辈子躲在农场里，夜间干活。", "haunt|hɔːnt|v. 闹鬼; farmhand|ˈfɑːmhænd|n. 农场工人; labourer|ˈleɪbərə|n. 劳工（英式拼写）; overnight|ˌəʊvəˈnaɪt|adv. 一夜之间; hay|heɪ|n. 干草; conscientious|ˌkɒnʃiˈenʃəs|adj. 认真的; suspect|səˈspekt|v. 怀疑; funeral|ˈfjuːnərəl|n. 葬礼; reveal|rɪˈviːl|v. 揭露; oblige|əˈblaɪdʒ|v. 迫使; detest|dɪˈtest|v. 厌恶; desert|dɪˈzɜːt|v. 开小差; regiment|ˈredʒɪmənt|n. 团; recluse|rɪˈkluːs|n. 隐士", ""],
  [31, "A lovable eccentric", "可爱的怪人", "participle,passive", "精明的富商迪基最讨厌势利眼。他衣着破旧去高级汽车陈列室买车，被店员冷落；这个特立独行的怪人深受全城人喜爱。", "eccentric|ɪkˈsentrɪk|n. 古怪的人; deliberately|dɪˈlɪbərətli|adv. 故意地; convention|kənˈvenʃn|n. 习俗; invariably|ɪnˈveəriəbli|adv. 总是; routine|ruːˈtiːn|n. 常规; shrewd|ʃruːd|adj. 精明的; legendary|ˈledʒəndri|adj. 传说中的; snob|snɒb|n. 势利小人; intensely|ɪnˈtensli|adv. 强烈地; fortune|ˈfɔːtʃuːn|n. 财产; showroom|ˈʃəʊruːm|n. 陈列室; ignore|ɪɡˈnɔː|v. 不理", ""],
  [32, "A lost ship", "一艘沉船", "passive,perfect", "打捞船在巴伦支海寻找一艘运金条的沉船未果，却意外捞起另一艘二战中被鱼雷击沉的巡洋舰的遗物，从航海日志中弄清了它的来历。", "salvage|ˈsælvɪdʒ|n. 打捞; mainland|ˈmeɪnlənd|n. 大陆; cargo|ˈkɑːɡəʊ|n. 货物; bullion|ˈbʊliən|n. 金条; scour|ˈskaʊə|v. 搜索; chest|tʃest|n. 箱子; belongings|bɪˈlɒŋɪŋz|n. 财物; wreck|rek|n. 沉船; cruiser|ˈkruːzə|n. 巡洋舰; log book|ˈlɒɡ bʊk|航海日志; convoy|ˈkɒnvɔɪ|n. 护航队; torpedo|tɔːˈpiːdəʊ|v. 用鱼雷袭击", ""],
  [33, "A day to remember", "难忘的一天", "participle,passive", "倒霉的日子里总是祸不单行：悉尼郊区两车相撞，后面一连串急刹车，一块蛋糕飞出挡风玻璃，卡车上的啤酒瓶滑落满地——只有两条野狗占了便宜。", "invariably|ɪnˈveəriəbli|adv. 总是; precisely|prɪˈsaɪsli|adv. 恰好; chain|tʃeɪn|n. 一连串; prelude|ˈpreljuːd|n. 序幕; unforeseen|ˌʌnfɔːˈsiːn|adj. 意料之外的; catastrophe|kəˈtæstrəfi|n. 灾难; crockery|ˈkrɒkəri|n. 陶器; collide|kəˈlaɪd|v. 相撞; panic|ˈpænɪk|n. 惊慌; windscreen|ˈwɪndskriːn|n. 挡风玻璃（英）; stray|streɪ|adj. 迷失的; confusion|kənˈfjuːʒn|n. 混乱; devour|dɪˈvaʊə|v. 吞食", "windscreen 是英式说法，美式说 windshield。"],
  [34, "A happy discovery", "幸运的发现", "compare,passive", "淘宝需要耐心和眼力。作者的朋友弗兰克在一家旧货店的破瓷器箱底发现一幅小画，只花了 50 英镑，它竟是意大利画家柯勒乔的杰作。", "antique|ænˈtiːk|n. 古董; fascination|ˌfæsɪˈneɪʃn|n. 魅力; forbidding|fəˈbɪdɪŋ|adj. 望而生畏的; muster|ˈmʌstə|v. 鼓起; pretentious|prɪˈtenʃəs|adj. 自命不凡的; labyrinth|ˈlæbərɪnθ|n. 迷宫; musty|ˈmʌsti|adj. 发霉的; rarity|ˈreərəti|n. 珍品; junk|dʒʌŋk|n. 破烂; dedicated|ˈdedɪkeɪtɪd|adj. 专注的; cherish|ˈtʃerɪʃ|v. 怀有; masterpiece|ˈmɑːstəpiːs|n. 杰作; dagger|ˈdæɡə|n. 匕首; miniature|ˈmɪnətʃə|adj. 小型的", ""],
  [35, "Justice was done", "伸张正义", "passive,modalperf", "夜里潜入珠宝店的小偷卡在狭窄的烟囱里十个小时，消防员凿墙才把他救出来，他当场认罪——正义在交给警察之前就已经伸张了。", "justice|ˈdʒʌstɪs|n. 正义; innocence|ˈɪnəsns|n. 无罪; guilt|ɡɪlt|n. 有罪; arduous|ˈɑːdjuəs|adj. 艰巨的; eminent|ˈemɪnənt|adj. 杰出的; abstract|ˈæbstrækt|adj. 抽象的; conception|kənˈsepʃn|n. 概念; interference|ˌɪntəˈfɪərəns|n. 干预; premises|ˈpremɪsɪz|n. 房屋; chimney|ˈtʃɪmni|n. 烟囱; muffled|ˈmʌfld|adj. 压低的; emerge|ɪˈmɜːdʒ|v. 出现", ""],
  [36, "A chance in a million", "百万分之一的机会", "compare,passive", "19 世纪的小说常用离奇的巧合收尾，现代读者已不再相信；可现实生活中，有时确实会发生连小说家都不敢写的巧合，课文就讲了这样一个真实的故事。", "credulous|ˈkredjələs|adj. 轻信的; conclusion|kənˈkluːʒn|n. 结局; coincidence|kəʊˈɪnsɪdəns|n. 巧合; improbable|ɪmˈprɒbəbl|adj. 不大可能的; obscure|əbˈskjʊə|adj. 无名的; presume|prɪˈzjuːm|v. 假定; plot|plɒt|v. 密谋; downfall|ˈdaʊnfɔːl|n. 垮台; naive|naɪˈiːv|adj. 天真的; dismiss|dɪsˈmɪs|v. 不予理会; unconvincing|ˌʌnkənˈvɪnsɪŋ|adj. 难以置信的; fictional|ˈfɪkʃənl|adj. 虚构的", ""],
  [37, "The Westhaven Express", "开往威斯特海温的快车", "perfect,compare", "人们对时刻表深信不疑。作者按一张旧时刻表去赶开往威斯特海温的快车，却眼看着火车呼啸而过——时刻表早已过时。", "punctual|ˈpʌŋktʃuəl|adj. 准时的; conditioning|kənˈdɪʃənɪŋ|n. 熏陶; unshakable|ʌnˈʃeɪkəbl|adj. 不可动摇的; faith|feɪθ|n. 信念; reliability|rɪˌlaɪəˈbɪləti|n. 可靠性; timetable|ˈtaɪmteɪbl|n. 时刻表; express|ɪkˈspres|n. 快车; platform|ˈplætfɔːm|n. 站台; porter|ˈpɔːtə|n. 搬运工; out of date|ˌaʊt əv ˈdeɪt|过时的", ""],
  [38, "The first calendar", "最早的日历", "passive,modalperf", "科学家研究史前人类刻在骨头和鹿角上的记号，认为它们可能记录了月亮的盈亏——这也许就是人类最早的日历。", "calendar|ˈkælɪndə|n. 日历; marking|ˈmɑːkɪŋ|n. 记号; bone|bəʊn|n. 骨头; antler|ˈæntlə|n. 鹿角; prehistoric|ˌpriːhɪˈstɒrɪk|adj. 史前的; notch|nɒtʃ|n. 刻痕; phase|feɪz|n. 月相; hunter|ˈhʌntə|n. 猎人; season|ˈsiːzn|n. 季节; interpret|ɪnˈtɜːprɪt|v. 解释; scratch|skrætʃ|n. 刻痕", ""],
  [39, "Nothing to worry about", "不必担心", "participle,cause", "朋友布鲁斯毫无危险意识，在坑坑洼洼、满是巨石的山路上照样把车开得飞快，一路惊险不断，他却总说“没什么好担心的”。", "plain|pleɪn|n. 平原; litter|ˈlɪtə|v. 乱扔; boulder|ˈbəʊldə|n. 巨砾; pit|pɪt|v. 使有凹坑; perturb|pəˈtɜːb|v. 使不安; underestimate|ˌʌndərˈestɪmeɪt|v. 低估; bump|bʌmp|v. 颠簸; swerve|swɜːv|v. 突然转向; scrape|skreɪp|v. 擦; groan|ɡrəʊn|v. 呻吟; accelerator|əkˈseləreɪtə|n. 油门; steep|stiːp|adj. 陡峭的; slope|sləʊp|n. 斜坡", ""],
  [40, "Who's who", "真假难辨", "passive,inf", "大学生最爱搞恶作剧：几个学生扮成修路工在伦敦闹市挖路，又分别打电话给警察和“工人”，让双方都以为对方是学生假扮的。", "hoax|həʊks|n. 恶作剧; practical joke|ˌpræktɪkl ˈdʒəʊk|恶作剧; specialize|ˈspeʃəlaɪz|v. 专门从事; crude|kruːd|adj. 粗鲁的; deception|dɪˈsepʃn|n. 欺骗; indulge|ɪnˈdʌldʒ|v. 沉溺; impersonate|ɪmˈpɜːsəneɪt|v. 扮演; sultan|ˈsʌltən|n. 苏丹; workman|ˈwɜːkmən|n. 工人; pneumatic drill|njuːˌmætɪk ˈdrɪl|风钻; incident|ˈɪnsɪdənt|n. 事件", "pneumatic 的 p 不发音 /njuːˈmætɪk/。"],
  [41, "Illusions of pastoral peace", "田园式宁静的幻觉", "inversion,compare", "生于城市长于城市的作者认为，朋友们对乡村生活的赞美只是幻觉：乡村冬夜漫长寂寞、购物不便、通勤辛苦，城市才能提供生活中最好的东西。", "illusion|ɪˈluːʒn|n. 幻觉; pastoral|ˈpɑːstərəl|adj. 田园的; bred|bred|adj. 长大的; rapture|ˈræptʃə|n. 狂喜; extol|ɪkˈstəʊl|v. 赞美; virtue|ˈvɜːtʃuː|n. 优点; superior|suːˈpɪəriə|adj. 优越的; twitter|ˈtwɪtə|v. 鸟叫; dawn|dɔːn|n. 黎明; glint|ɡlɪnt|v. 闪光; pasture|ˈpɑːstʃə|n. 牧场; idyllic|ɪˈdɪlɪk|adj. 田园诗般的; dubious|ˈdjuːbiəs|adj. 不确定的; privilege|ˈprɪvəlɪdʒ|n. 特权", ""],
  [42, "Modern cavemen", "现代洞穴人", "passive,modal", "洞穴探险是一项新兴运动，探险者的动机难以解释；深洞探险需要像军事行动一样周密计划，课文讲述了一支探险队深入法国一个极深洞穴的经历。", "caveman|ˈkeɪvmæn|n. 穴居人; exploration|ˌekspləˈreɪʃn|n. 探险; pot-holing|ˈpɒt həʊlɪŋ|n. 洞穴探险; solitude|ˈsɒlɪtjuːd|n. 孤独; lure|lʊə|v. 吸引; motive|ˈməʊtɪv|n. 动机; instinct|ˈɪnstɪŋkt|n. 本能; rambler|ˈræmblə|n. 漫步者; undertaking|ˌʌndəˈteɪkɪŋ|n. 事业; foresight|ˈfɔːsaɪt|n. 远见; precaution|prɪˈkɔːʃn|n. 预防措施; descent|dɪˈsent|n. 下降", ""],
  [43, "Fully insured", "全保险", "passive,cond", "如今几乎什么都能投保：演员保脸蛋、钢琴家保双手……课文介绍了保险的由来和几个稀奇古怪的保险故事。", "insure|ɪnˈʃʊə|v. 给……保险; insurance|ɪnˈʃʊərəns|n. 保险; policy|ˈpɒləsi|n. 保险单; premium|ˈpriːmiəm|n. 保险费; risk|rɪsk|n. 风险; claim|kleɪm|n. 索赔; compensation|ˌkɒmpenˈseɪʃn|n. 赔偿; accident|ˈæksɪdənt|n. 事故; protect|prəˈtekt|v. 保护; unusual|ʌnˈjuːʒuəl|adj. 不寻常的", ""],
  [44, "Speed and comfort", "又快又舒适", "compare,inversion", "比较几种长途旅行方式：火车闷、汽车累、轮船慢且容易晕船，飞机虽然贵，在速度和舒适上却无可匹敌。", "compartment|kəmˈpɑːtmənt|n. 车厢; cramped|kræmpt|adj. 狭窄的; stuffy|ˈstʌfi|adj. 闷热的; monotonous|məˈnɒtənəs|adj. 单调的; lull|lʌl|v. 使入睡; couchette|kuːˈʃet|n. 卧铺; frontier|ˈfrʌntɪə|n. 边境; destination|ˌdestɪˈneɪʃn|n. 目的地; spacious|ˈspeɪʃəs|adj. 宽敞的; seasick|ˈsiːsɪk|adj. 晕船的; intimidate|ɪnˈtɪmɪdeɪt|v. 恐吓; exhilarating|ɪɡˈzɪləreɪtɪŋ|adj. 令人兴奋的; escapist|ɪˈskeɪpɪst|n. 逃避现实者", ""],
  [45, "The power of the press", "新闻报道的力量", "cond,passive", "报纸能改变普通人的命运：美国一个贫穷家庭生了五胞胎，一夜之间被记者、厂商和礼物包围，名利双收，却从此再也无法过正常的生活。", "democratic|ˌdeməˈkrætɪk|adj. 民主的; restrict|rɪˈstrɪkt|v. 限制; condemn|kənˈdem|v. 谴责; abuse|əˈbjuːz|v. 滥用; contention|kənˈtenʃn|n. 观点; perpetual|pəˈpetʃuəl|adj. 永久的; poverty|ˈpɒvəti|n. 贫穷; obscurity|əbˈskjʊərəti|n. 默默无闻; quintuplets|kwɪnˈtjuːplɪts|n. 五胞胎; radically|ˈrædɪkli|adv. 根本地; exclusive|ɪkˈskluːsɪv|adj. 独家的; spokesman|ˈspəʊksmən|n. 发言人; commercialization|kəˌmɜːʃəlaɪˈzeɪʃn|n. 商业化", ""],
  [46, "Do it yourself", "自己动手", "inversion,participle", "人们越来越热衷于“自己动手”。作者也自告奋勇修割草机，结果拆得七零八落再也装不回去，如今房子被一片“丛林”包围。", "passion|ˈpæʃn|n. 热情; specialized|ˈspeʃəlaɪzd|adj. 专门的; plead|pliːd|v. 以……为借口; ignorance|ˈɪɡnərəns|n. 无知; embark|ɪmˈbɑːk|v. 着手; enthusiast|ɪnˈθjuːziæst|n. 爱好者; craze|kreɪz|n. 狂热; novice|ˈnɒvɪs|n. 新手; handyman|ˈhændimæn|n. 杂务工; resourceful|rɪˈzɔːsfl|adj. 足智多谋的; delusion|dɪˈluːʒn|n. 错觉; mower|ˈməʊə|n. 割草机; dismantle|dɪsˈmæntl|v. 拆开; insurmountable|ˌɪnsəˈmaʊntəbl|adj. 不可逾越的", "So great is our passion… 是 so + 形容词放句首的倒装。"],
  [47, "Too high a price?", "代价太高？", "passive,modal", "污染是人口过多、工业过度发展的代价；处理垃圾只有四种办法：倾倒、焚烧、回收利用、减少产生，作者呼吁人们节约资源、减少浪费。", "pollution|pəˈluːʃn|n. 污染; overpopulated|ˌəʊvəˈpɒpjuleɪtɪd|adj. 人口过多的; dump|dʌmp|v. 倾倒; extravagant|ɪkˈstrævəɡənt|adj. 浪费的; submerge|səbˈmɜːdʒ|v. 淹没; refuse|ˈrefjuːs|n. 垃圾; underlying|ˌʌndəˈlaɪɪŋ|adj. 根本的; resource|rɪˈzɔːs|n. 资源; plastic|ˈplæstɪk|n. 塑料; recycle|ˌriːˈsaɪkl|v. 回收; packaging|ˈpækɪdʒɪŋ|n. 包装", ""],
  [48, "The silent village", "沉默的村庄", "participle,passive", "作者夫妇在巴尔干半岛旅游时误入一个与世隔绝的山村，村民和孩子们一言不发地盯着他们，令人毛骨悚然，两人赶紧离开。", "inaccessible|ˌɪnækˈsesəbl|adj. 难以到达的; hospitable|hɒˈspɪtəbl|adj. 好客的; hostile|ˈhɒstaɪl|adj. 不友好的; vicinity|vəˈsɪnəti|n. 附近; fresco|ˈfreskəʊ|n. 壁画; dense|dens|adj. 稠密的; abruptly|əˈbrʌptli|adv. 突然; moor|mɔː|v. 系泊; perch|pɜːtʃ|v. 坐落; dilapidated|dɪˈlæpɪdeɪtɪd|adj. 破旧的; procession|prəˈseʃn|n. 队伍; glare|ɡleə|v. 怒视; shawl|ʃɔːl|n. 披巾", "hostile 英音 /ˈhɒstaɪl/，美音 /ˈhɑːstl/。"],
  [49, "The ideal servant", "理想的仆人", "cond,perfect", "哈丽特姑妈一辈子都在寻找“理想的仆人”。能干的厨娘贝西深得信任三年，直到一次宴会上醉醺醺地把布丁摔在餐桌上，人们才发现她一直在偷喝酒窖里的酒。", "servant|ˈsɜːvənt|n. 仆人; domestic|dəˈmestɪk|adj. 家庭的; leisurely|ˈleʒəli|adj. 悠闲的; rambling|ˈræmblɪŋ|adj. 布局零乱的; lavishly|ˈlævɪʃli|adv. 慷慨地; immaculate|ɪˈmækjələt|adj. 一尘不染的; parquet|ˈpɑːkeɪ|n. 拼木地板; preside|prɪˈzaɪd|v. 主持; fickleness|ˈfɪklnəs|n. 变化无常; disillusion|ˌdɪsɪˈluːʒn|v. 使醒悟; mirth|mɜːθ|n. 欢笑; cellar|ˈselə|n. 地窖", ""],
  [50, "New Year resolutions", "新年的决心", "perfect,participle", "作者今年只给自己定了两个小目标——每天早上锻炼、晚上多读书，可没坚持几天就前功尽弃；最后买了一本《如何一分钟读一千字》，却没时间读。", "resolution|ˌrezəˈluːʃn|n. 决心; compile|kəmˈpaɪl|v. 编辑; formidable|fəˈmɪdəbl|adj. 令人生畏的; recur|rɪˈkɜː|v. 重复; attainment|əˈteɪnmənt|n. 达到; inveterate|ɪnˈvetərət|adj. 积习已深的; frustration|frʌˈstreɪʃn|n. 挫折; ambitious|æmˈbɪʃəs|adj. 雄心勃勃的; pitfall|ˈpɪtfɔːl|n. 陷阱; assiduously|əˈsɪdjuəsli|adv. 勤勉地; discipline|ˈdɪsəplɪn|n. 纪律; taunt|tɔːnt|n. 嘲笑; wane|weɪn|v. 减弱", ""],
  [51, "Predicting the future", "预测未来", "modalperf,passive", "预测未来非常困难：20 世纪 70 年代谁能想到电脑会像电视机一样走进千家万户？课文回顾了从大型主机到个人电脑、再到互联网的发展。", "predict|prɪˈdɪkt|v. 预测; notoriously|nəʊˈtɔːriəsli|adv. 众所周知地; mainframe|ˈmeɪnfreɪm|n. 主机; technician|tekˈnɪʃn|n. 技术员; software|ˈsɒftweə|n. 软件; function|ˈfʌŋkʃn|n. 功能; primitive|ˈprɪmətɪv|adj. 原始的; launch|lɔːntʃ|v. 推出; revolution|ˌrevəˈluːʃn|n. 革命; access|ˈækses|n. 使用; device|dɪˈvaɪs|n. 设备", ""],
  [52, "Mud is mud", "泥就是泥", "cond,passive", "表兄哈里爱跑到高档化妆品店，故意要求买根本不存在的东西刁难店员；有一次他要“香泥”，店员竟真拿出一瓶，他只好高价买下——这瓶香泥治好了他的恶作剧习惯。", "mud|mʌd|n. 泥; permanent|ˈpɜːmənənt|adj. 永久的; tint|tɪnt|v. 着色; substance|ˈsʌbstəns|n. 物质; perfume|ˈpɜːfjuːm|v. 使有香味; dispel|dɪˈspel|v. 消除; outlandish|aʊtˈlændɪʃ|adj. 古怪的; acquisition|ˌækwɪˈzɪʃn|n. 获得; cosmetic|kɒzˈmetɪk|adj. 化妆用的; outrageous|aʊtˈreɪdʒəs|adj. 荒唐的; embarrassed|ɪmˈbærəst|adj. 尴尬的", ""],
  [53, "In the public interest", "为了公众的利益", "passive,subj", "瑞典早在 1809 年就设立“巡视官”制度，专门调查公民对官员的投诉；课文举例：巡视官派律师查明一名警察歧视外国人，及时制止了这种行为。", "Scandinavian|ˌskændɪˈneɪviən|adj. 斯堪的纳维亚的; enlightened|ɪnˈlaɪtnd|adj. 开明的; incompetent|ɪnˈkɒmpɪtənt|adj. 不称职的; safeguard|ˈseɪfɡɑːd|v. 保护; grievance|ˈɡriːvəns|n. 委屈; ombudsman|ˈɒmbʊdzmən|n. 巡视官; correspondence|ˌkɒrəˈspɒndəns|n. 信件; reprimand|ˈreprɪmɑːnd|v. 训斥; accusation|ˌækjuˈzeɪʃn|n. 指控; ascertain|ˌæsəˈteɪn|v. 查明; prejudiced|ˈpredʒədɪst|adj. 有偏见的; prosecute|ˈprɒsɪkjuːt|v. 起诉", ""],
  [54, "Instinct or cleverness?", "是本能还是机智？", "passive,participle", "人们害怕昆虫又对它们着迷。作者用胶带缠住桃树根部，想阻止蚂蚁上树吃蚜虫的“蜜”，第二天蚂蚁却沿着墙爬上了树——作者被蚂蚁的机灵彻底打败。", "instinct|ˈɪnstɪŋkt|n. 本能; contaminate|kənˈtæmɪneɪt|v. 污染; provocation|ˌprɒvəˈkeɪʃn|n. 挑衅; wasp|wɒsp|n. 黄蜂; moth|mɒθ|n. 蛾; revulsion|rɪˈvʌlʃn|n. 厌恶; horde|hɔːd|n. 一大群; uncanny|ʌnˈkæni|adj. 神秘的; mantis|ˈmæntɪs|n. 螳螂; aphid|ˈeɪfɪd|n. 蚜虫; scurry|ˈskʌri|v. 急促奔跑; bewilderment|bɪˈwɪldəmənt|n. 迷惑; ingenuity|ˌɪndʒəˈnjuːəti|n. 机灵", ""],

  const ALL = BASIC.concat(G);

  function wordsOf(s) { return (s.match(/[A-Za-z][A-Za-z'’-]*/g) || []); }

  function testPassive(s) {
    const re = new RegExp("\\b(am|is|are|was|were|be|been|being)\\s+(?:(?:not|never|also|often|still|now|then|always|usually|generally|already|just|only|largely|actually|really|\\w+ly)\\s+){0,2}([a-z]+(?:ed|en)|" + IRREG + ")\\b", "ig");
    let m;
    while ((m = re.exec(s))) { if (!NOT_PART.test(m[2])) return true; }
    return false;
  }
  function testPerfect(s) {
    const re = new RegExp("\\b(has|have|had|having|'ve|'d)\\s+(?:(?:not|never|already|just|ever|also|always|long|since|recently|\\w+ly)\\s+){0,2}(been|[a-z]+ed|[a-z]+en|" + IRREG + ")\\b", "ig");
    let m;
    while ((m = re.exec(s))) { if (!NOT_PART.test(m[2]) || m[2] === "been") return true; }
    return false;
  }

  function testProg(s) {
    const re = /\b(am|is|are|was|were|'m|'re|'s|be|been)\s+(?:not\s+|still\s+|always\s+|just\s+)?([a-z]+ing)\b/ig;

    while ((m = re.exec(s))) { if (!/^(thing|something|nothing|anything|everything|during|morning|evening|king|ring|spring|string|interesting|exciting|boring|amusing|surprising|charming|willing|missing|living|building|ceiling|feeling|meaning|darling)$/.test(m[2].toLowerCase())) return true; }
    return false;
  }

  function tags(sentence, book) {
    const out = [];
    for (const g of ALL) {
      if (book && g.books && !g.books.includes(book)) continue;
      let hit = false;
      if (g.id === "passive") hit = testPassive(sentence);
      else if (g.id === "perfect") hit = testPerfect(sentence);
      else if (g.id === "prog") hit = testProg(sentence);
      else hit = g.re.test(sentence);
      if (hit) out.push(g);
    }
    // 强调句与形式主语只保留一个提示，避免重复
    if (out.find((g) => g.id === "cleft") && out.find((g) => g.id === "formal_it")) {
      return out.filter((g) => g.id !== "cleft");
    }
    return out;

  // 生成词形变化，用于匹配本课重点词
  function forms(w) {
    w = w.toLowerCase();
    const f = new Set([w, w + "s", w + "es", w + "ed", w + "d", w + "ing", w + "er", w + "ly", w + "al"]);
    if (w.endsWith("e")) { f.add(w.slice(0, -1) + "ing"); f.add(w.slice(0, -1) + "ion"); }
    if (w.endsWith("y")) { f.add(w.slice(0, -1) + "ies"); f.add(w.slice(0, -1) + "ied"); }
    if (/[^aeiou][aeiou][bdgmnprt]$/.test(w)) { const d = w + w.slice(-1); f.add(d + "ed"); f.add(d + "ing"); }
    if (w.endsWith("sis")) f.add(w.slice(0, -3) + "ses");
    if (w.endsWith("on")) f.add(w.slice(0, -2) + "a");
    return f;
  }

  /* 把句子切成 token 并打上颜色类别 */
  function colorize(sentence, vocab) {
    const vocabMap = new Map();
    (vocab || []).forEach((v) => {
      const head = v.w.split(" ")[0];
      if (v.w.includes(" ")) return;
      forms(head).forEach((f) => vocabMap.set(f, v));
    });
    const parts = sentence.match(/[A-Za-z][A-Za-z'’-]*|\d[\d,.]*|[^\sA-Za-z\d]+|\s+/g) || [];
    const toks = parts.map((p) => ({ t: p, w: /^[A-Za-z]/.test(p) ? p.toLowerCase().replace(/[’']s$/, "") : null, cls: "" }));
    const words = toks.filter((x) => x.w);
    const prevWordIdx = (i) => { for (let j = i - 1; j >= 0; j--) { if (toks[j].w) return j; if (/[,;:—–(]/.test(toks[j].t)) return -1; } return -1; };
    const nextWordIdx = (i) => { for (let j = i + 1; j < toks.length; j++) { if (toks[j].w) return j; if (/[,;:.!?—–()]/.test(toks[j].t)) return -1; } return -1; };

    for (let i = 0; i < toks.length; i++) {
      const tk = toks[i];
      if (!tk.w) continue;
      const w = tk.w;
      if (tk.cls) continue;
      if (STRONG_CONJ.has(w) || (CONJ.has(w) && !["that", "as", "so", "and", "or", "but", "yet", "before", "after", "since", "once"].includes(w))) {
        tk.cls = "conj"; tk.tip = "连接词 / 从句引导词";

      if (w === "that") {

        const pw = p >= 0 ? toks[p].w : "";

    const res = { audio: {}, texts: {}, unmatched: [], log: [] };
    const list = Array.from(files).filter((f) => !/^\./.test(f.name));
    const db = opts.defaultBook || null;
    let done = 0;
    for (const f of list) {
      done++;
      onProgress && onProgress(done, list.length, f.name);
      const path = f._path || f.webkitRelativePath || f.name;

        if (AUDIO_EXT.test(f.name)) {

            if (!cur || (cur._even && !even) || (cur._even === even && f.size > cur.size)) { f._even = even; res.audio[id] = f; }
          } else res.unmatched.push(f);
        } else if (TEXT_EXT.test(f.name)) {
          const text = decode(await f.arrayBuffer());
          if (/\.(lrc|srt)$/i.test(f.name)) {
            let d = detectLesson(f.name, path, db);
            const tiM = text.match(/\[ti:([^\]]*)\]/i);
            if ((!d || !d.b) && tiM) d = detectLesson(tiM[1], path, db) || d;
            if (!d || !d.b) {
              const firstLine = (text.match(/\]\s*(lesson\s*\d+[^\n]*)/i) || [])[1];
              if (firstLine) d = detectLesson(firstLine, path, db) || d;
            }
            if (d && d.b) {
              const id = d.b + "-" + d.n;
              const p = /\.lrc$/i.test(f.name) ? parseLRC(text, id) : parseSRT(text, id);
              if (p.sents.length) putText(res, d.b, d.n, { sents: p.sents, source: /\.lrc$/i.test(f.name) ? "lrc" : "srt", file: f.name });
            } else res.unmatched.push(f);
          } else {
            const multi = splitMultiLesson(text);
            const bk = detectBook(path) || db;
            if (multi && bk) {
              let k = 0;
              Object.entries(multi).forEach(([n, chunk]) => {
                n = +n;
                if (n > MAXN[bk]) return;
                const id = bk + "-" + unitOf(bk, n);
                const p = parsePlainLesson(chunk, id);
                if (p.sents.length > 1) { putText(res, bk, n, { ...p, source: "txt", file: f.name }); k++; }
              });
              res.log.push(`${f.name}：拆分出第 ${bk} 册 ${k} 课`);
            } else if (multi && !bk) {
              res.log.push(`${f.name}：包含多课，但认不出是第几册——请在上方“默认册数”里选好册数后重新导入`);
            } else {
              const d = detectLesson(f.name, path, db);
              if (d && d.b) { const id = d.b + "-" + d.n; putText(res, d.b, d.n, { ...parsePlainLesson(text, id), source: "txt", file: f.name }); }
              else res.unmatched.push(f);
            }
          }
        } else if (PDF_EXT.test(f.name)) {
          const text = await pdfToText(f);
          const multi = splitMultiLesson(text);
          const bk = detectBook(path) || db;
          if (multi && bk) {
            let k = 0;
            Object.entries(multi).forEach(([n, chunk]) => {
              n = +n;
              if (n > MAXN[bk]) return;
              const id = bk + "-" + unitOf(bk, n);
              const p = parsePlainLesson(chunk, id);
              if (p.sents.length > 1) { putText(res, bk, n, { ...p, source: "pdf", file: f.name }); k++; }
            });
            res.log.push(`${f.name}：从 PDF 拆分出第 ${bk} 册 ${k} 课`);
          } else if (multi) {
            res.log.push(`${f.name}：PDF 包含多课，但认不出是第几册——请先选好“默认册数”再导入`);
          } else {
            const d = detectLesson(f.name, path, db);
            if (d && d.b) { const id = d.b + "-" + d.n; putText(res, d.b, d.n, { ...parsePlainLesson(text, id), source: "pdf", file: f.name }); }
            else res.log.push(`${f.name}：没能在 PDF 里找到 “Lesson N” 标题`);
          }
        }
      } catch (e) {
        res.log.push(`${f.name}：读取失败（${e.message}）`);
      }
    }
    Object.values(res.texts).forEach((t) => delete t.evenFirst);
    return res;
  }

  /* 递归读取文件夹（File System Access API） */
  async function readDirHandle(dir, prefix = "", out = [], depth = 0) {
    if (depth > 4) return out;
    for await (const [name, h] of dir.entries()) {
      if (h.kind === "file") {
        if (AUDIO_EXT.test(name) || TEXT_EXT.test(name) || PDF_EXT.test(name)) {
          const f = await h.getFile();
          f._path = prefix + name;
          out.push(f);
        }
      } else if (h.kind === "directory" && !name.startsWith(".")) {
        await readDirHandle(h, prefix + name + "/", out, depth + 1);
      }
    }
    return out;
  }

  /* IndexedDB：记住上次的文件夹；手机上把导入的音频保存在本机 */
  let dbPromise = null;
  function idb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((res, rej) => {
      const r = indexedDB.open("nce-island", 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
        if (!db.objectStoreNames.contains("audio")) db.createObjectStore("audio");
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { dbPromise = null; rej(r.error); };
    });
    return dbPromise;
  }
  async function tx(store, mode, fn) {
    const db = await idb();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && "result" in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error("存储空间不足或被浏览器拒绝"));
    });
  }

  const idbGet = (k) => tx("kv", "readonly", (st) => st.get(k));
  // 把文件内容读成独立的 Blob 再保存，避免部分手机浏览器只保存“文件引用”
  async function audioPut(id, file) {
    const blob = new Blob([await file.arrayBuffer()], { type: file.type || "audio/mpeg" });
    return tx("audio", "readwrite", (st) => { st.put({ name: file.name, blob }, id); });
  }
  async function audioAll() {
    const db = await idb();
    return new Promise((res, rej) => {
      const out = {};
      const req = db.transaction("audio", "readonly").objectStore("audio").openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      req.onerror = () => rej(req.error);
    });
  }
  const audioClear = () => tx("audio", "readwrite", (st) => { st.clear(); });

  window.Parser = { detectLesson, detectBook, unitOf, MAXN, decode, parseLRC, parseSRT, parsePlainLesson, splitMultiLesson, splitSentences, processFiles, readDirHandle, idbSet, idbGet, audioPut, audioAll, audioClear, AUDIO_EXT, TEXT_EXT, PDF_EXT };
})();

    if (!window.speechSynthesis) { toast("当前浏览器不支持语音朗读，请使用 Edge 或 Chrome"); return; }
    stopAudio();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = opts.voice || pickVoice(opts.gender);
    if (v) u.voice = v;
    u.lang = v ? v.lang : accent().lang;
    u.rate = opts.rate || S.settings.rate || 0.9;
    if (opts.onend) u.onend = opts.onend;
    speechSynthesis.speak(u);
  }
  /* 指定男声 / 女声朗读；本机没有这种声音时提示去下载 */
  function speakAs(text, g) {
    const has = accVoices().some((v) => voiceGender(v) === g || v.voiceURI === (g === "m" ? S.settings.voiceM : S.settings.voiceF));
    if (!has) toast(`本机没有检测到${accent().name}${g === "m" ? "男" : "女"}声，先用其他声音朗读；到「我的 → 设置」查看下载方法`);
    speak(text, { gender: g });
  }
  function voiceHelp() {
    const a = accent();
    if (isIOS()) return `iPhone：打开「设置 → 辅助功能 → 朗读内容 → 声音 → 英语」，在“${a === ACCENTS.gb ? "英国" : "美国"}”下面下载声音（${a === ACCENTS.gb ? "女声 Kate、Serena、Stephanie、Martha；男声 Daniel、Oliver、Arthur" : "女声 Samantha、Ava、Allison、Zoe；男声 Alex、Evan、Nathan、Tom"}），选带“增强 / 高级”的音质更好。下载后彻底关掉本 App 再打开。`;
    if (isTouch()) return `安卓：打开「设置 → 文字转语音输出 → 首选引擎（Google 语音服务）→ 设置 → 安装语音数据 → 英语（${a === ACCENTS.gb ? "英国" : "美国"}）」，里面有多个男声、女声可下载。下载后彻底关掉本 App 再打开。`;
    if (/Mac/i.test(navigator.platform)) return `Mac：打开「系统设置 → 辅助功能 → 朗读内容 → 系统声音 → 管理声音」，在“英语（${a === ACCENTS.gb ? "英国" : "美国"}）”里下载 ${a === ACCENTS.gb ? "Kate、Serena、Stephanie（女）和 Oliver、Arthur（男）" : "Samantha、Ava、Allison（女）和 Alex、Evan、Nathan（男）"}，选“高级”音质。也可以用 Microsoft Edge 打开本程序，Edge 自带 ${a === ACCENTS.gb ? "Sonia、Libby、Maisie（女）和 Ryan、Thomas（男）" : "Aria、Jenny、Michelle（女）和 Guy、Andrew、Brian（男）"} 等自然语音（需联网）。`;
    return `用 <b>Microsoft Edge</b> 打开本程序，自带 ${a === ACCENTS.gb ? "Sonia、Libby、Maisie（女）和 Ryan、Thomas（男）" : "Aria、Jenny、Michelle（女）和 Guy、Andrew、Brian（男）"} 等自然语音（需联网）；或在 Windows「设置 → 时间和语言 → 语音 → 添加语音」里添加 English (${a === ACCENTS.gb ? "United Kingdom" : "United States"})。`;
  }

  /* ---------------- 原声音频 ---------------- */
  const player = new Audio();
  player.preload = "auto";
  let segTimer = null, segEnd = null, segCb = null;
  function audioFor(id) {
    const a = AUDIO[id]; if (!a) return null;
    if (!a.url) a.url = URL.createObjectURL(a.file);
    return a.url;
  }
  function stopAudio() { player.pause(); clearInterval(segTimer); segTimer = null; segEnd = null; const cb = segCb; segCb = null; if (cb) cb(false); }
  function playSegment(id, t0, t1, cb) {
    const url = audioFor(id);
    if (!url) return false;
    if (window.speechSynthesis) speechSynthesis.cancel();
    stopAudio();
    if (player.src !== url) player.src = url;
    player.playbackRate = S.settings.audioRate || 1;
    try { player.preservesPitch = true; } catch (e) {}
    const go = () => {
      player.currentTime = Math.max(0, (t0 || 0) - 0.05);
      player.play().catch(() => toast("音频无法播放，可能是格式不受支持"));
      segEnd = t1; segCb = cb || null;
      clearInterval(segTimer);
      segTimer = setInterval(() => {
        if ((segEnd != null && player.currentTime >= segEnd) || player.ended) { player.pause(); clearInterval(segTimer); segTimer = null; const c = segCb; segCb = null; if (c) c(true); }
      }, 40);
    };
    if (player.readyState >= 1) go(); else player.addEventListener("loadedmetadata", go, { once: true });
    return true;
  }
  function playSentence(id, s, cb) {
    if (s.t0 != null && AUDIO[id] && playSegment(id, s.t0, s.t1, cb)) return "audio";
    speak(s.en, { onend: () => cb && cb(true) });
    return "tts";
  }

  /* ---------------- 路由 ---------------- */
  const NAV = [
    ["#/", "🏠", "今日学习"], ["#/map", "🗺️", "学习地图"], ["#/lessons", "📚", "四册课程"],
    ["#/words", "⭐", "生词本"], ["#/files", "📂", "我的课文文件"], ["#/method", "🧭", "学习方法"], ["#/settings", "⚙️", "设置与计划"],
  ];
  function navHTML() {
    const h = location.hash || "#/";
    const on = (href) => (href === "#/" ? h === "#/" || h === "" : h.startsWith(href)) ? "on" : "";
    $("#nav").innerHTML = NAV.map(([href, ico, txt]) => `<a href="${href}" class="${on(href)}"><span class="ico">${ico}</span>${txt}</a>`).join("");
    $("#topbar").innerHTML = NAV.map(([href, ico, txt]) => `<a href="${href}" class="${on(href)}">${ico} ${txt}</a>`).join("");
    $("#bottombar").innerHTML = [["#/", "🏠", "今日"], ["#/map", "🗺️", "地图"], ["#/lessons", "📚", "课程"], ["#/words", "⭐", "生词"], ["#/settings", "👤", "我的"]]
      .map(([href, ico, txt]) => `<a href="${href}" class="${on(href) || (href === "#/settings" && /^#\/(files|method)/.test(h) ? "on" : "")}"><span class="ico">${ico}</span>${txt}</a>`).join("");
    $("#sideFoot").innerHTML = `课文 ${Object.keys(TEXTS).length}/${TOTAL_UNITS} · 音频 ${Object.keys(AUDIO).length}/${TOTAL_UNITS}<br>连续学习 ${streak()} 天 🔥`;
  }
  function render() {
    stopAudio(); if (window.speechSynthesis) speechSynthesis.cancel();
    closePop();
    document.querySelectorAll(".backdrop").forEach((b) => b.remove());
    const parts = (location.hash || "#/").replace(/^#\//, "").split("/");
    trackNav(location.hash || "#/");
    navHTML();
    const main = $("#main");
    window.scrollTo(0, 0);
    if (parts[0] === "") { main.innerHTML = viewHome(); bindInstall(main); }
    else if (parts[0] === "map") main.innerHTML = viewMap();
    else if (parts[0] === "lessons") main.innerHTML = viewLessons(+parts[1] || dominantBook(PLAN[currentDay() - 1]).b);
    else if (parts[0] === "lesson") viewLesson(main, parts[1], parts[2] || "intro");
    else if (parts[0] === "day") viewDay(main, +parts[1]);
    else if (parts[0] === "words") viewWords(main);
    else if (parts[0] === "files") viewFiles(main);
    else if (parts[0] === "method") main.innerHTML = viewMethod();
    else if (parts[0] === "settings") viewSettings(main);
    else main.innerHTML = viewHome();
    addBackBar(main);
  }
  window.addEventListener("hashchange", render);

  /* ---------------- 返回上一页 ----------------
   * 自己记一份浏览栈：同一课里切换 6 个步骤算同一页，返回时直接回到进课之前的页面；
   * 没有上一页（比如刚打开 App 就在课程页）时，回到上一级页面。 */
  const pageKey = (h) => { const p = h.replace(/^#\/?/, "").split("/"); return p[0] === "lesson" ? "lesson/" + p[1] : p.join("/"); };
  let navStack = [];
  function trackNav(h) {
    const k = pageKey(h), top = navStack[navStack.length - 1], prev = navStack[navStack.length - 2];
    if (top && top.key === k) { top.hash = h; return; }
    if (prev && prev.key === k) { navStack.pop(); prev.hash = h; return; }
    navStack.push({ key: k, hash: h });
    if (navStack.length > 60) navStack.shift();
  }
  function parentHash(h) {
    const p = h.replace(/^#\/?/, "").split("/");
    if (p[0] === "lesson" && LMAP[p[1]]) return "#/lessons/" + LMAP[p[1]].b;
    if (p[0] === "files" || p[0] === "method") return "#/settings";
    return "#/";
  }
  function pageName(key) {
    const p = key.split("/");
    if (p[0] === "lesson") return LMAP[p[1]] ? lessonTitle(LMAP[p[1]]) : "课程";
    if (p[0] === "day") return `第 ${p[1]} 天复习`;
    if (p[0] === "lessons" && p[1]) return `四册课程 · ${BOOKS[+p[1] - 1] ? BOOKS[+p[1] - 1].name : ""}`;
    return { "": "今日学习", map: "学习地图", lessons: "四册课程", words: "生词本", files: "我的课文文件", method: "学习方法", settings: "我的 · 设置" }[p[0]] || "上一页";
  }
  function goBack() {
    const prev = navStack[navStack.length - 2];
    if (prev) { location.hash = prev.hash; return; }
    navStack = [];
    location.hash = parentHash(location.hash || "#/");
  }
  function addBackBar(main) {
    const h = location.hash || "#/";
    if (pageKey(h) === "") return;
    const prev = navStack[navStack.length - 2];
    const target = prev ? prev.key : pageKey(parentHash(h));
    main.insertAdjacentHTML("afterbegin", `<div class="backbar"><button class="btn sm ghost back-btn" id="backBtn" aria-label="返回上一页：${esc(pageName(target))}">← 返回</button><span class="muted small">${esc(pageName(target))}</span></div>`);
    $("#backBtn", main).onclick = goBack;
  }

  /* 添加到桌面的说明卡片 */

    return `<div class="card install-card" style="margin-top:16px">
      <div class="row spread"><h3 style="margin:0">📱 添加到手机桌面</h3>${compact ? `<button class="btn sm ghost" id="installHide">不再提示</button>` : ""}</div>
      <p class="small" style="margin:8px 0">${how}</p>
      <p class="small muted" style="margin:0 0 8px">添加后像 App 一样点图标打开：全屏显示、可以离线使用，导入的课文和音频都保存在手机里。</p>

    </div>`;

  function bindInstall(root) {
    const b = $("#installBtn", root);

      <div class="hero" style="--hc:${bk.hex}">

        <a class="card stat" href="#/words" style="text-decoration:none;color:inherit"><b>${Object.keys(S.starred).length}</b><span class="muted small">生词本 · 今日待复习 ${dueWords}</span></a>

      <div class="grid g4">${BOOKS.map((B) => { const ls = LESSONS.filter((l) => l.b === B.b); const dn = ls.filter((l) => lessonDone(l.id)).length; return `
        <a class="lesson-card" style="--c:${B.hex}" href="#/lessons/${B.b}"><div class="row spread"><span class="n">${B.emoji} ${B.name}</span><span class="small muted">${dn}/${ls.length}</span></div>

  /* 任务很多时（第一册一天二十多个单元）先显示未完成的前 6 个，其余折叠 */
  function taskList(ids) {

  function cycleBlock(k) {

      <div class="grid g3" style="margin-top:14px">${ls.map((l) => `
        <a class="lesson-card" style="--c:${B.hex}" href="#/lesson/${l.id}">
          <div class="row spread"><span class="n">${l.label.toUpperCase()}</span><span class="small">${AUDIO[l.id] ? "🎧" : ""}${TEXTS[l.id] ? "📄" : ""}${lessonDone(l.id) ? " ✅" : ""}</span></div>
          <div class="t">${esc(l.t)}</div><div class="muted small">${esc(l.cn)}</div>

  }

  /* ---------------- 课程页 ---------------- */
  function viewLesson(main, id, tab) {
    const l = LMAP[id];
    if (!l) { location.hash = "#/lessons"; return; }
    const B = bookOf(l), st = lessonSteps(id);
    const prev = LESSONS[l.idx - 1], next = LESSONS[l.idx + 1];
    const hasText = contentSents(id).length > 0;
    main.innerHTML = `
      <div class="lesson-head" style="--c:${B.hex}">
        <div class="row spread">
          <div><div class="small" style="opacity:.9">${B.emoji} ${B.name} · ${B.island} · ${l.label.toUpperCase()}</div>
            <h1>${esc(l.t)}</h1><div>${esc(l.cn)}</div></div>
          <div class="row">
            ${prev ? `<a class="btn sm" style="background:rgba(255,255,255,.25);color:#fff" href="#/lesson/${prev.id}">← 上一课</a>` : ""}
            ${next ? `<a class="btn sm" style="background:rgba(255,255,255,.25);color:#fff" href="#/lesson/${next.id}">下一课 →</a>` : ""}
          </div>
        </div>
        <div class="small" style="margin-top:8px;opacity:.95">${AUDIO[id] ? "🎧 原声已关联" : "🎧 未关联原声（将用英式 TTS 朗读）"} · ${hasText ? `📄 原文 ${contentSents(id).length} 句（来自 ${esc(TEXTS[id].file || "粘贴")}）` : "📄 尚未导入原文"}</div>
        <button class="btn sm" id="voiceToggle" style="margin-top:8px;background:rgba(255,255,255,.25);color:#fff" title="切换单词、慢读等英式朗读用的声音">朗读声音：${GENDER_LABEL[S.settings.voicePref || "f"]} ⇄</button>
      </div>
      <div class="pill-tabs" style="--c:${B.hex}">
        ${STEPS.map((s, i) => `<button data-tab="${s.id}" class="${tab === s.id ? "on" : ""}">${i + 1}. ${s.icon} ${s.name} ${st[s.id] ? '<span class="ok">✔</span>' : ""}</button>`).join("")}
      </div>
      <div id="tabBody"></div>`;
    $$(".pill-tabs button", main).forEach((b) => b.onclick = () => { location.hash = `#/lesson/${id}/${b.dataset.tab}`; });
    $("#voiceToggle", main).onclick = (e) => {
      S.settings.voicePref = S.settings.voicePref === "m" ? "f" : "m"; save();
      e.currentTarget.textContent = `朗读声音：${GENDER_LABEL[S.settings.voicePref]} ⇄`;
      speakAs("Hello, welcome to New Concept English.", S.settings.voicePref);
    };
    const fn = { intro: tabIntro, words: tabWords, read: tabRead, grammar: tabGrammar, shadow: tabShadow, quiz: tabQuiz }[tab] || tabIntro;
    fn($("#tabBody"), id, l, B);
  }
  function doneBar(id, step, label, B) {
    const st = lessonSteps(id);
    const next = STEPS[STEPS.findIndex((s) => s.id === step) + 1];
    const nl = LESSONS[LMAP[id].idx + 1];
    return `<div class="row" style="margin-top:22px">
      <button class="btn ${st[step] ? "" : "primary"}" data-done="${step}" style="${st[step] ? "" : `background:${B.hex}`}">${st[step] ? "✔ 已完成本步" : "✅ " + label}</button>
      ${next ? `<a class="btn ghost" href="#/lesson/${id}/${next.id}">下一步：${next.icon} ${next.name} →</a>` : (nl ? `<a class="btn ghost" href="#/lesson/${nl.id}">进入下一课 →</a>` : "")}
    </div>`;
  }
  function bindDone(body, id) {
    $$("[data-done]", body).forEach((b) => b.onclick = () => { completeStep(id, b.dataset.done); const next = STEPS[STEPS.findIndex((s) => s.id === b.dataset.done) + 1]; if (next) location.hash = `#/lesson/${id}/${next.id}`; else render(); });
  }
  function needText(l) {
    return `<div class="card" style="border-left:6px solid var(--i2)">
      <h3>📄 这一步需要课文原文</h3>
      <p class="muted">请先在「我的课文文件」里导入你下载的新概念英语（LRC / TXT / PDF），或者直接把本课课文粘贴到下面：</p>
      <textarea id="pasteBox" placeholder="把${lessonTitle(l)}的英文课文粘贴到这里（可以带中文译文，程序会自动分开）"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="pasteOk">保存课文</button><a class="btn ghost" href="#/files">📂 导入整个文件夹</a></div>
    </div>`;
  }
  function bindPaste(id) {
    const b = $("#pasteOk"); if (!b) return;
    b.onclick = () => {
      const t = $("#pasteBox").value.trim();
      if (!/[A-Za-z]{3,}/.test(t)) { toast("没有识别到英文内容"); return; }
      const p = Parser.parsePlainLesson(t, id);
      TEXTS[id] = { ...p, source: "paste", file: "粘贴" };
      saveTexts(); toast(`已保存 ${p.sents.length} 句`); render();
    };
  }

  /* 1 导读盲听 */
  function tabIntro(body, id, l, B) {
    const t = TEXTS[id];
    body.innerHTML = `
      <div class="grid g2">
        <div class="card"><h3>🎧 第一遍：盲听（不看原文）</h3>
          <p class="muted small">先别看课文！带着问题完整听一遍，能听懂多少算多少，这是检验进步的“起点”。</p>
          <div class="note"><b>🤔 听前问题：</b>${esc(l.q)}</div>
          <div style="margin-top:12px">
          ${AUDIO[id] ? `<audio controls preload="metadata" src="${audioFor(id)}" style="width:100%"></audio>` :
            (contentSents(id).length ? `<button class="btn dark" id="ttsAll">🔊 用英式发音朗读全文</button><div class="muted small" style="margin-top:6px">未关联原声 MP3，将使用电脑的英式语音。</div>` : `<div class="muted">尚未导入音频与课文。<a href="#/files">去导入</a></div>`)}
          </div>
        </div>
        <div class="card"><h3>📖 课文导读（通俗版）</h3><p>${esc(l.sum)}</p>
          <div class="note small"><b>🧭 读法建议：</b>${esc(l.bg)}</div></div>
      </div>
      <div class="grid g2" style="margin-top:16px">
        <div class="card"><h3>🇬🇧 英音提示</h3><p>${esc(l.tip)}</p>
          <p class="muted small">英式发音（RP）三大特点：① 非卷舌：car /kɑː/，r 不发音；② not、hot 的 o 读短圆唇 /ɒ/；③ go、home 读 /əʊ/。</p></div>
        <div class="card"><h3>🧩 本课语法重点</h3>${l.g.map((gid) => { const g = Grammar.byId[gid]; return g ? `<div class="gtag" style="--k:${g.color}"><b>${g.name}</b><div class="small">${esc(g.desc)}</div></div>` : ""; }).join("")}</div>
      </div>
      ${t && t.cnText ? `<div class="card" style="margin-top:16px"><h3>🀄 你文件中的参考译文</h3><details><summary class="muted">听完、读完再展开看</summary><p style="white-space:pre-wrap">${esc(t.cnText)}</p></details></div>` : ""}
      ${S.settings.apiKey && contentSents(id).length ? `<div class="card" style="margin-top:16px"><h3>🤖 AI 老师导读</h3><p class="muted small">让 AI 老师结合你的课文原文，用通俗中文讲讲全文结构和难点。</p><button class="btn" id="aiLesson">生成本课导读</button><div id="aiLessonOut" style="margin-top:10px"></div></div>` : ""}
      ${doneBar(id, "intro", "我已盲听并读完导读", B)}`;
    const tts = $("#ttsAll");
    if (tts) tts.onclick = () => speak(contentSents(id).map((s) => s.en).join(" "));
    const ai = $("#aiLesson");
    if (ai) ai.onclick = () => aiExplainLesson(id, $("#aiLessonOut"));
    bindDone(body, id);
  }

  /* 2 英音词汇 */
  function tabWords(body, id, l, B) {
    body.innerHTML = `
      <div class="row spread"><p class="muted" style="margin:0">点 🔊 听英式发音，跟读 3 遍；黄色高亮是它在你课文原文中的位置。点 ☆ 加入生词本。</p>
        <div class="row"><button class="btn sm" id="playAllW">🔊 连续朗读</button><button class="btn sm" id="starAll">☆ 全部加入生词本</button></div></div>
      <div class="grid g3" style="margin-top:12px">${l.words.map((w, i) => {
        const ex = exampleFor(w, id);
        return `<div class="word-card" style="--c:${B.hex}">
          <div class="row spread"><span class="w">${esc(w.w)}</span>
            <span><button class="icon-btn" data-say="${esc(w.w)}" title="英式发音">🔊</button>
            <button class="star" data-star="${i}" title="加入生词本">${S.starred[w.w] ? "⭐" : "☆"}</button></span></div>
          <div class="ipa">/${esc(w.ipa)}/ <span class="chip">英</span></div>
          <div>${esc(w.cn)}</div>
          ${ex ? `<div class="example">${markWord(ex, w.w)} <button class="icon-btn" style="display:inline-grid;width:24px;height:24px;font-size:11px" data-say="${esc(ex)}">🔊</button></div>` : (contentSents(id).length ? "" : `<div class="example small">导入原文后显示课文例句</div>`)}
        </div>`; }).join("")}</div>
      ${doneBar(id, "words", "这些词我会读、会认了", B)}`;
    $$("[data-say]", body).forEach((b) => b.onclick = () => speak(b.dataset.say));
    $$("[data-star]", body).forEach((b) => b.onclick = () => { toggleStar(l.words[+b.dataset.star]); b.textContent = S.starred[l.words[+b.dataset.star].w] ? "⭐" : "☆"; });
    $("#starAll").onclick = () => { l.words.forEach((w) => { if (!S.starred[w.w]) toggleStar(w, true); }); save(); render(); };
    $("#playAllW").onclick = () => {
      let i = 0;
      const next = () => { if (i >= l.words.length || !location.hash.includes("/words")) return; speak(l.words[i].w, { onend: () => setTimeout(next, 900) }); i++; };
      next();
    };
    bindDone(body, id);
  }
  function toggleStar(w, silent) {
    if (S.starred[w.w]) delete S.starred[w.w];
    else S.starred[w.w] = { w: w.w, ipa: w.ipa, cn: w.cn, id: w.id, b: w.b, box: 0, due: todayStr() };
    if (!silent) { save(); toast(S.starred[w.w] ? `⭐ 已加入生词本：${w.w}` : `已移出生词本：${w.w}`); }
  }

  /* 3 逐句精读 */
  function tabRead(body, id, l, B) {
    const sents = lessonSents(id);
    if (!contentSents(id).length) { body.innerHTML = needText(l); bindPaste(id); return; }
    let showCn = S.settings.showCn;
    const hasAudio = !!AUDIO[id];
    body.innerHTML = `
      <div class="row spread" style="margin-bottom:10px">
        <div class="legend">
          <span style="--k:var(--a-conj)">连接词/从句引导词</span><span style="--k:var(--a-verb)">谓语动词</span>
          <span style="--k:var(--a-nonf)">非谓语 (to do / doing / done)</span><span style="--k:var(--a-prep)">介词</span><span style="--k:var(--a-vocab)">本课重点词</span>
        </div>
        <div class="row">
          <button class="btn sm" id="toggleCn">${showCn ? "隐藏" : "显示"}中文</button>
          <button class="btn sm" id="playAll">▶ ${hasAudio ? "连续播放原声" : "英音连读"}</button>
          <select id="aRate" style="width:auto">${[0.7, 0.8, 0.9, 1, 1.1, 1.25].map((r) => `<option value="${r}" ${r == (S.settings.audioRate || 1) ? "selected" : ""}>${r}x</option>`).join("")}</select>
        </div>
      </div>
      <div class="reader">
        <div class="card" id="sentList">${sents.map((s) => `
          <div class="sent ${s.meta ? "meta" : ""}" data-i="${s.i}">
            <div class="idx">${s.meta ? "" : s.i + 1}</div>
            <div style="flex:1;min-width:0"><div class="en">${esc(s.en)}</div>${s.cn ? `<div class="cn ${showCn ? "" : "hidden"}">${esc(s.cn)}</div>` : ""}</div>
            <div class="tools">
              <button class="icon-btn" data-play="${s.i}" title="${s.t0 != null && hasAudio ? "播放原声" : "英式朗读"}">${s.t0 != null && hasAudio ? "▶" : "🔊"}</button>
              ${s.t0 != null && hasAudio ? `<button class="icon-btn" data-tts="${s.i}" title="英式 TTS 慢读">🐢</button>` : ""}
            </div>
          </div>`).join("")}</div>
        <div class="card panel sheet" id="anaPanel"></div>
      </div>
      ${doneBar(id, "read", "全文逐句精读完毕", B)}`;
    $("#toggleCn").onclick = () => { S.settings.showCn = !S.settings.showCn; save(); showCn = S.settings.showCn; $$(".sent .cn", body).forEach((e) => e.classList.toggle("hidden", !showCn)); $("#toggleCn").textContent = (showCn ? "隐藏" : "显示") + "中文"; };
    $("#aRate").onchange = (e) => { S.settings.audioRate = +e.target.value; save(); player.playbackRate = S.settings.audioRate; };
    const highlight = (i) => { $$(".sent", body).forEach((e) => e.classList.toggle("playing", +e.dataset.i === i)); };
    $$("[data-play]", body).forEach((b) => b.onclick = (e) => { e.stopPropagation(); const s = sents[+b.dataset.play]; highlight(s.i); playSentence(id, s, () => highlight(-1)); });
    $$("[data-tts]", body).forEach((b) => b.onclick = (e) => { e.stopPropagation(); speak(sents[+b.dataset.tts].en, { rate: 0.75 }); });
    const panel = $("#anaPanel");
    const closeSheet = () => { panel.classList.remove("open"); const bd = $(".backdrop"); if (bd) bd.remove(); };
    const openSheet = () => {
      if (!isNarrow()) return;
      panel.classList.add("open"); panel.scrollTop = 0;
      if (!$(".backdrop")) { const bd = document.createElement("div"); bd.className = "backdrop"; bd.onclick = closeSheet; document.body.appendChild(bd); }
    };
    panel.addEventListener("click", (e) => { if (e.target.closest(".sheet-close")) closeSheet(); });
    window.addEventListener("hashchange", closeSheet, { once: true });
    $$(".sent", body).forEach((el) => el.onclick = () => {
      $$(".sent", body).forEach((e) => e.classList.remove("on")); el.classList.add("on");
      analyzeInto(panel, id, sents[+el.dataset.i], sents);
      openSheet();
    });
    $("#playAll").onclick = () => {
      let i = 0;
      const next = () => {
        if (!location.hash.includes("/read")) return;
        while (i < sents.length && !sents[i].en) i++;
        if (i >= sents.length) { highlight(-1); return; }
        const s = sents[i++]; highlight(s.i);
        const el = $(`.sent[data-i="${s.i}"]`, body); if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        playSentence(id, s, (ok) => { if (ok) setTimeout(next, hasAudio && s.t0 != null ? 150 : 400); });
      };
      next();
    };
    const first = contentSents(id)[0];
    const el = $(`.sent[data-i="${first.i}"]`, body); el.classList.add("on");
    analyzeInto($("#anaPanel"), id, first, sents);
    bindDone(body, id);
  }

  const CHUNK_COLORS = ["var(--i1)", "var(--i2)", "var(--i3)", "var(--i4)", "var(--i5)", "var(--i6)"];
  function analyzeInto(panel, id, s, sents) {
    const l = LMAP[id];
    const toks = Grammar.colorize(s.en, l.words);
    const tags = Grammar.tags(s.en, l.b);
    const ch = Grammar.chunks(s.en);
    const tr = Grammar.trunk(s.en);
    const dif = Grammar.difficulty(s.en);
    const vocabHere = [];
    toks.forEach((t) => { if (t.vocab && !vocabHere.includes(t.vocab)) vocabHere.push(t.vocab); });
    const cacheKey = "s:" + id + ":" + s.en;
    const hasAudio = s.t0 != null && AUDIO[id];
    panel.innerHTML = `
      <div class="sheet-grip"></div>
      <div class="row spread"><h3 style="margin:0">🔍 第 ${s.i + 1} 句</h3>
        <span class="row" style="gap:6px"><span class="chip">${dif.words} 词 · ${["", "⭐ 简单", "⭐⭐ 中等", "⭐⭐⭐ 长难句"][dif.level]}</span><button class="btn sm sheet-close">✕</button></span></div>
      <div class="colored" style="margin-top:8px">${toks.map((t) => t.w ? `<span class="tk ${t.cls} ${t.vocab ? "vocab" : ""}" data-w="${esc(t.t)}" title="${esc(t.tip || "")}">${esc(t.t)}</span>` : esc(t.t)).join("")}</div>
      <div class="row" style="margin:6px 0 4px">
        <button class="btn sm" id="pPlay">${hasAudio ? "▶ 原声" : "🔊 英音"}</button>
        <button class="btn sm" id="pSlow">🐢 英音慢读</button>
        <button class="btn sm" id="pLoop">🔁 循环 3 遍</button>
        <button class="btn sm" id="pFemale">👩 英音女声</button>
        <button class="btn sm" id="pMale">👨 英音男声</button>
      </div>
      ${s.cn ? `<div class="note small" style="margin-top:8px"><b>译文：</b>${esc(s.cn)}</div>` : ""}
      <h3 style="margin-top:14px">🫧 意群切分 <span class="muted small">（按块停顿朗读，点击单块发音）</span></h3>
      <div class="chunks">${ch.map((c, i) => `<span style="--cc:${CHUNK_COLORS[i % 6]}" data-chunk="${esc(c)}">${esc(c)}</span>`).join("")}</div>
      ${tr ? `<h3 style="margin-top:14px">🦴 主干提示 <span class="muted small">（自动去掉修饰成分，仅供参考）</span></h3><div class="en" style="font-size:16px">${esc(tr)}</div>` : ""}
      <h3 style="margin-top:14px">🧩 语法点</h3>
      ${tags.length ? tags.map((g) => `<div class="gtag" style="--k:${g.color}"><b>${g.name}</b><div class="small">${esc(g.desc)}</div><div class="small muted">读法：${esc(g.how)}</div></div>`).join("") : `<div class="muted small">这句结构比较简单：主语 + 谓语 + 宾语/表语，直接顺读即可。</div>`}
      ${vocabHere.length ? `<h3 style="margin-top:14px">🔤 本句重点词</h3>${vocabHere.map((v) => `<div class="row" style="gap:6px"><b class="en">${esc(v.w)}</b><span class="ipa">/${esc(v.ipa)}/</span><span class="small">${esc(v.cn)}</span><button class="icon-btn" data-sayw="${esc(v.w)}">🔊</button></div>`).join("")}` : ""}
      <p class="muted small" style="margin-top:10px">👆 点击上面彩色句子中的任何单词，可查看英式发音与释义。</p>
      <h3 style="margin-top:14px">🤖 AI 老师精讲</h3>
      <div id="aiOut">${AI_CACHE[cacheKey] ? renderMd(AI_CACHE[cacheKey]) : (S.settings.apiKey ? `<button class="btn" id="aiBtn" style="background:var(--i6);color:#fff">请 AI 老师用中文讲解这句</button>` : `<div class="muted small">在「我的 → 设置」里填写 DeepSeek API Key 后，可让 AI 老师逐句讲解：译文、主干、结构拆解、英式发音要点。</div>`)}</div>`;
    $("#pPlay", panel).onclick = () => playSentence(id, s);
    $("#pSlow", panel).onclick = () => speak(s.en, { rate: 0.72 });
    $("#pFemale", panel).onclick = () => speakAs(s.en, "f");
    $("#pMale", panel).onclick = () => speakAs(s.en, "m");
    $("#pLoop", panel).onclick = () => { let k = 0; const go = () => { if (k++ < 3) playSentence(id, s, (ok) => ok && setTimeout(go, 600)); }; go(); };
    $$("[data-chunk]", panel).forEach((e) => e.onclick = () => speak(e.dataset.chunk, { rate: 0.8 }));
    $$("[data-sayw]", panel).forEach((e) => e.onclick = () => speak(e.dataset.sayw));
    $$(".tk", panel).forEach((e) => e.onclick = (ev) => showPop(e.dataset.w, ev));
    const ai = $("#aiBtn", panel);
    if (ai) ai.onclick = () => aiExplainSentence(id, s, sents, $("#aiOut", panel), cacheKey);
  }

  /* 单词浮层 */
  function closePop() { const p = $(".pop"); if (p) p.remove(); }
  document.addEventListener("click", (e) => { if (!e.target.closest(".pop") && !e.target.closest(".tk")) closePop(); });
  function showPop(word, ev) {
    closePop();
    const clean = word.replace(/[’']s$/, "").replace(/[^A-Za-z'-]/g, "");
    const v = findWord(clean);
    const p = document.createElement("div");
    p.className = "pop";
    p.innerHTML = `<div class="row spread"><span class="w">${esc(clean)}</span><button class="icon-btn" id="popSay">🔊</button></div>
      ${v ? `<div class="ipa">/${esc(v.ipa)}/ <span class="chip">英</span></div><div>${esc(v.cn)}</div><div class="muted small">${lessonTitle(LMAP[v.id])} 重点词：${esc(v.w)}</div>` : `<div class="muted small">本词不在课程词表中。可以听英式发音，或查英式词典：</div>`}
